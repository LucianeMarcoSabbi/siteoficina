<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola de Sal - Player Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Imagem de fundo */
            background: url('imagem musica.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Move o conteúdo para baixo */
            min-height: 100vh;
            color: white;
            padding-bottom: 30px; /* Espaço da borda inferior */
        }

        .container {
            /* Fundo muito mais transparente e com menos desfoque */
            background: rgba(0, 0, 0, 0.2); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 95%;
            max-width: 600px; /* Reduzi a largura para cobrir menos a lateral */
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* --- Audio Player Compacto --- */
        .audio-player {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        button {
            background: #2ecc71;
            border: none;
            padding: 8px 16px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #2ecc71;
        }

        .time {
            font-size: 12px;
            font-family: monospace;
        }

        /* --- YouTube Container Menor --- */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            opacity: 0.9; /* Deixa o vídeo levemente transparente até o hover */
            transition: opacity 0.3s;
        }
        
        .video-container:hover {
            opacity: 1;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .label-text {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bússola de Sal</h1>
    
    <div class="audio-player">
        <span class="label-text">Sintonia Digital</span>
        
        <audio id="myAudio">
            <source src="bússola de sal.mp3" type="audio/mpeg">
        </audio>

        <div class="controls">
            <button id="playBtn">PLAY</button>
            <button id="pauseBtn">PAUSE</button>
        </div>

        <div class="timeline-container">
            <span id="currentTime" class="time">0:00</span>
            <input type="range" id="seekSlider" value="0" max="100">
            <span id="duration" class="time">0:00</span>
        </div>
        
        <div style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <small style="font-size: 10px;">VOLUME</small>
            <input type="range" id="volumeSlider" value="100" max="100" style="width: 80px;">
        </div>
    </div>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
</div>

<script>
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeText = document.getElementById('currentTime');
    const durationText = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');

    playBtn.addEventListener('click', () => audio.play());
    pauseBtn.addEventListener('click', () => audio.pause());

    audio.addEventListener('timeupdate', () => {
        const position = audio.currentTime / audio.duration;
        seekSlider.value = position * 100;
        currentTimeText.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
        durationText.textContent = formatTime(audio.duration);
    });

    seekSlider.addEventListener('input', () => {
        const time = audio.duration * (seekSlider.value / 100);
        audio.currentTime = time;
    });

    volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value / 100;
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return min + ":" + (sec < 10 ? "0" + sec : sec);
    }
</script>

</body>
</html>
